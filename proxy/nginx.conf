events {
    worker_connections 2048;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    gzip on;
    gzip_types text/plain application/javascript text/css application/json application/xml;

    server_names_hash_bucket_size 128;

    # DNS de Docker: los sitios resuelven el nombre en cada petición, no solo al cargar.
    resolver 127.0.0.11 valid=10s;

    # Dominios que apuntan aquí pero no tienen sitio en el panel: se rechazan en vez de caer
    # en el primer sitio por orden alfabético (mostraba otro proyecto con su certificado).
    server {
        listen 80 default_server;
        server_name _;
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
        location / {
            return 444;
        }
    }

    server {
        listen 443 ssl default_server;
        server_name _;
        ssl_reject_handshake on;
    }

    # Un archivo por dominio, generado desde el panel.
    include /etc/nginx/sites/*.conf;
}
