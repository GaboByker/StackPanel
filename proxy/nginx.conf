events {
    worker_connections 2048;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    gzip on;
    gzip_types text/plain application/javascript text/css application/json application/xml;

    server_names_hash_bucket_size 128;

    # DNS interno de Docker: permite que los "set $var host:puerto; proxy_pass
    # http://$var;" de cada sitio vuelvan a resolver el nombre en caliente,
    # en vez de quedarse con la IP vieja cuando un contenedor se recrea.
    resolver 127.0.0.11 valid=10s;

    # Los sitios se generan/gestionan desde el panel (Administración → Proxy).
    # Cada dominio vive en su propio archivo dentro de sites/.
    include /etc/nginx/sites/*.conf;
}
