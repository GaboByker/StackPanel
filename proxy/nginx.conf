events {
    worker_connections 2048;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    gzip on;
    gzip_types text/plain application/javascript text/css application/json application/xml;

    server_names_hash_bucket_size 128;

    # DNS de Docker: los sitios resuelven el nombre en cada petición, no solo al cargar.
    resolver 127.0.0.11 valid=10s;

    # Un archivo por dominio, generado desde el panel.
    include /etc/nginx/sites/*.conf;
}
