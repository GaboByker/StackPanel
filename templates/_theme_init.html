<script>
	// Aplica el tema guardado (claro/oscuro) antes de pintar la página, para
	// que todas las pantallas (portal, login, panel…) usen la misma elección.
	(function () {
		try {
			var saved = localStorage.getItem('panel-theme');
			if (saved === 'dark' || saved === 'light') document.documentElement.setAttribute('data-theme', saved);
		} catch (e) {}
	})();
</script>
