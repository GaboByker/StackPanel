{% extends "base_admin.html" %}
{% block title %}Nuevo administrador{% endblock %}
{% block heading %}Nuevo administrador{% endblock %}
{% block content %}

<p class="admin-hint">Solo tú (u otro admin) puede dar de alta nuevas cuentas.</p>

{% if error %}
<div class="alert alert-error">{{ error }}</div>
{% endif %}

<form method="post" style="max-width:380px;">
	<input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
	<div class="field">
		<label for="email">Correo electrónico</label>
		<input type="email" id="email" name="email" required autofocus/>
	</div>
	<div class="field">
		<label for="password">Contraseña</label>
		<input type="password" id="password" name="password" required minlength="8"/>
	</div>
	<button type="submit" class="btn btn-primary">Crear administrador</button>
	<a class="btn btn-secondary" href="/admin/admins">Cancelar</a>
</form>

{% endblock %}
