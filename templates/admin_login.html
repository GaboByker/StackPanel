{% from '_icons.html' import icon_chevron_left %}
<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="utf-8"/>
	<meta name="viewport" content="width=device-width, initial-scale=1"/>
	<title>Iniciar sesión — Panel</title>
	<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate"/>
	<meta http-equiv="Pragma" content="no-cache"/>
	<link rel="preconnect" href="https://fonts.googleapis.com"/>
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"/>
	<link rel="stylesheet" href="/static/css/portal.css"/>
</head>
<body class="auth-shell">
	<div class="auth-card">
		<h1>Administración</h1>
		<p class="auth-subtitle">Acceso solo para administradores autorizados.</p>

		{% if error %}
		<div class="alert alert-error">{{ error }}</div>
		{% endif %}

		<form method="post">
			<input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
			<div class="field">
				<label for="email">Correo</label>
				<input type="email" id="email" name="email" required autofocus placeholder="admin@correo.com"/>
			</div>
			<div class="field">
				<label for="password">Contraseña</label>
				<input type="password" id="password" name="password" required/>
			</div>
			<button type="submit" class="btn btn-primary">Iniciar sesión</button>
		</form>

		<p class="auth-footer"><a href="/">{{ icon_chevron_left(cls='icon icon-sm') }} Volver al portal</a></p>
	</div>
	<script>
		window.addEventListener('pageshow', function (event) {
			if (event.persisted) { window.location.reload(); }
		});
	</script>
</body>
</html>
