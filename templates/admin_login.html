<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="utf-8"/>
	<meta name="viewport" content="width=device-width, initial-scale=1"/>
	<title>Admin — Portal</title>
	<link rel="stylesheet" href="/static/css/portal.css"/>
</head>
<body class="landing-page admin-page">
	<main class="landing-wrap admin-wrap">
		<section class="admin-card">
			<h1>Administración del portal</h1>
			<p class="admin-subtitle">Solo administradores autorizados. No hay registro público.</p>

			{% if error %}
			<div class="alert alert-error">{{ error }}</div>
			{% endif %}

			<form method="post" class="admin-form">
				<label for="email">Correo</label>
				<input type="email" id="email" name="email" required autofocus placeholder="admin@correo.com"/>

				<label for="password">Contraseña</label>
				<input type="password" id="password" name="password" required/>

				<button type="submit" class="btn btn-primary">Iniciar sesión</button>
			</form>

			<p class="admin-footer-link"><a href="/">← Volver al portal</a></p>
		</section>
	</main>
</body>
</html>
